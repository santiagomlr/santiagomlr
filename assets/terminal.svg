<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392">
<defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.l{opacity:0;animation:in .5s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.sweep{animation:sw 4s linear infinite}@keyframes sw{from{transform:translateX(-700px)}to{transform:translateX(700px)}}
.dot{animation:pl 2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
</style>
<linearGradient id="tb" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity=".5"/><stop offset="1" stop-color="#E3B341" stop-opacity=".5"/></linearGradient></defs>
<rect x=".5" y=".5" width="1199" height="391" rx="16" fill="#0A0F1F" stroke="url(#tb)"/>
<rect x=".5" y=".5" width="1199" height="44" rx="16" fill="#111933"/><rect x=".5" y="28" width="1199" height="17" fill="#111933"/>
<circle cx="28" cy="22" r="7" fill="#FF5F57"/><circle cx="52" cy="22" r="7" fill="#FEBC2E"/><circle cx="76" cy="22" r="7" fill="#28C840"/>
<text x="600.0" y="27" text-anchor="middle" class="mono" font-size="13" fill="#64748B">santiago@brain: ~ (zsh)</text>
<text x="32" y="86" class="mono l" style="animation-delay:0.3s" font-size="17"><tspan fill="#22D3EE">santiago@brain</tspan><tspan fill="#64748B">:</tspan><tspan fill="#A78BFA">~</tspan><tspan fill="#64748B">$ </tspan><tspan fill="#F1F5F9">./profile --summary</tspan></text>
<text x="32" y="120" class="mono l" style="animation-delay:0.8s" font-size="17"><tspan fill="#22D3EE">› </tspan><tspan fill="#CBD5E1">Finance grad, Tec de Monterrey (Family Business track)</tspan></text>
<text x="32" y="154" class="mono l" style="animation-delay:1.2s" font-size="17"><tspan fill="#22D3EE">› </tspan><tspan fill="#CBD5E1">Founder of kalu: B2B news intelligence, live with paying customers</tspan></text>
<text x="32" y="188" class="mono l" style="animation-delay:1.6s" font-size="17"><tspan fill="#22D3EE">› </tspan><tspan fill="#CBD5E1">Continuous Improvement @ Grupo Senda: AI tools for fleet, finance &amp; ops</tspan></text>
<text x="32" y="222" class="mono l" style="animation-delay:2.1s" font-size="17"><tspan fill="#22D3EE">› </tspan><tspan fill="#CBD5E1">Runs a self-hosted second brain: 580+ pages, 24-agent AI council</tspan></text>
<text x="32" y="256" class="mono l" style="animation-delay:2.6s" font-size="17"><tspan fill="#22D3EE">› </tspan><tspan fill="#CBD5E1">Ships with TypeScript · React · Supabase · Python · Claude</tspan></text>
<text x="32" y="290" class="mono l" style="animation-delay:3.0s" font-size="17"><tspan fill="#22D3EE">santiago@brain</tspan><tspan fill="#64748B">:</tspan><tspan fill="#A78BFA">~</tspan><tspan fill="#64748B">$ </tspan><tspan fill="#F1F5F9">echo $MOTTO</tspan></text>
<text x="32" y="324" class="mono l" style="animation-delay:3.5s" font-size="17" fill="#E3B341">&quot;If it repeats, automate it. If it matters, measure it.&quot;</text>
<text x="32" y="358" class="mono l" style="animation-delay:3.9s" font-size="17"><tspan fill="#22D3EE">santiago@brain</tspan><tspan fill="#64748B">:</tspan><tspan fill="#A78BFA">~</tspan><tspan fill="#64748B">$ </tspan><tspan class="blink" fill="#F1F5F9">█</tspan></text>
