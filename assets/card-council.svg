<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250">
<defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.l{opacity:0;animation:in .5s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.sweep{animation:sw 4s linear infinite}@keyframes sw{from{transform:translateX(-700px)}to{transform:translateX(700px)}}
.dot{animation:pl 2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
</style>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1530"/><stop offset="1" stop-color="#090D1C"/></linearGradient>
<radialGradient id="h" cx="1" cy="0" r=".8"><stop offset="0" stop-color="#A78BFA" stop-opacity=".22"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
<linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity="0"/><stop offset=".5" stop-color="#A78BFA" stop-opacity=".9"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="580" height="250" rx="18"/></clipPath></defs>
<g clip-path="url(#c)">
<rect width="580" height="250" fill="url(#g)"/><rect width="580" height="250" fill="url(#h)"/>
<rect class="sweep" x="0" y="0" width="300" height="3" fill="url(#sw)"/>
</g>
<rect x=".5" y=".5" width="579" height="249" rx="18" fill="none" stroke="#A78BFA" stroke-opacity=".35"/>
<rect x="28" y="28" width="48" height="48" rx="12" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".5"/>
<text x="52" y="61" text-anchor="middle" class="sans" font-size="24" fill="#A78BFA">♛</text>
<text x="92" y="62" class="sans" font-size="28" font-weight="800" fill="#F8FAFC">Brain Council</text>
<rect x="411.6" y="38" width="140.39999999999998" height="28" rx="14" fill="#A78BFA" fill-opacity=".12"/>
<circle class="dot" cx="427.6" cy="52" r="4" fill="#A78BFA"/>
<text x="439.6" y="56.5" class="mono" font-size="12" font-weight="700" fill="#A78BFA" letter-spacing="0.5">24 AI ADVISORS</text>
<text x="28" y="112" class="sans" font-size="16.5" fill="#CBD5E1">24 AI personas built from my own psychometrics</text>
<text x="28" y="137" class="sans" font-size="16.5" fill="#CBD5E1">and mental models (Strategist, Engineer, Shadow...)</text>
<text x="28" y="162" class="sans" font-size="16.5" fill="#CBD5E1">that debate and vote on my hardest decisions.</text>
<rect x="28" y="196" width="66.4" height="28" rx="8" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
<text x="61.2" y="214.5" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">Claude</text>
<rect x="102.4" y="196" width="103.4" height="28" rx="8" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
<text x="154.10000000000002" y="214.5" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">Multi-agent</text>
<rect x="213.8" y="196" width="118.2" height="28" rx="8" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
<text x="272.90000000000003" y="214.5" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">Prompt design</text>
<rect x="340.0" y="196" width="118.2" height="28" rx="8" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
<text x="399.1" y="214.5" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">Decision logs</text>
</svg>