<rect x="377.4" y="196" width="103.4" height="28" rx="8" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
<text x="429.09999999999997" y="214.5" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">Forecasting</text>
</svg>