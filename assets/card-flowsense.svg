<rect x="95.0" y="196" width="96.0" height="28" rx="8" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
<text x="143.0" y="214.5" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">TypeScript</text>
