<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="60" viewBox="0 0 1200 60">
<defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.l{opacity:0;animation:in .5s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.sweep{animation:sw 4s linear infinite}@keyframes sw{from{transform:translateX(-700px)}to{transform:translateX(700px)}}
.dot{animation:pl 2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
</style>
<linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
<linearGradient id="r" x1="1" x2="0"><stop offset="0" stop-color="#E3B341"/><stop offset="1" stop-color="#E3B341" stop-opacity="0"/></linearGradient></defs>
<rect x="164.0" y="29" width="340" height="2" fill="url(#r)" transform="rotate(180 334.0 30)"/>
<rect x="696.0" y="29" width="340" height="2" fill="url(#l)" transform="rotate(180 866.0 30)"/>
<text x="600" y="38" text-anchor="middle" class="mono" font-size="22" font-weight="700" letter-spacing="6" fill="#22D3EE">ABOUT ME</text>
</svg>