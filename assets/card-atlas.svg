<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250">
<defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.l{opacity:0;animation:in .5s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.sweep{animation:sw 4s linear infinite}@keyframes sw{from{transform:translateX(-700px)}to{transform:translateX(700px)}}
.dot{animation:pl 2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
</style>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1530"/><stop offset="1" stop-color="#090D1C"/></linearGradient>
<radialGradient id="h" cx="1" cy="0" r=".8"><stop offset="0" stop-color="#34D399" stop-opacity=".22"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient>
<linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#34D399" stop-opacity="0"/><stop offset=".5" stop-color="#34D399" stop-opacity=".9"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="580" height="250" rx="18"/></clipPath></defs>
<g clip-path="url(#c)">
<rect width="580" height="250" fill="url(#g)"/><rect width="580" height="250" fill="url(#h)"/>
<rect class="sweep" x="0" y="0" width="300" height="3" fill="url(#sw)"/>
</g>
<rect x=".5" y=".5" width="579" height="249" rx="18" fill="none" stroke="#34D399" stroke-opacity=".35"/>
<rect x="28" y="28" width="48" height="48" rx="12" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-opacity=".5"/>
<text x="52" y="61" text-anchor="middle" class="sans" font-size="24" fill="#34D399">⚙</text>
<text x="92" y="62" class="sans" font-size="28" font-weight="800" fill="#F8FAFC">Atlas</text>
<rect x="419.2" y="38" width="132.8" height="28" rx="14" fill="#34D399" fill-opacity=".12"/>
<circle class="dot" cx="435.2" cy="52" r="4" fill="#34D399"/>
<text x="447.2" y="56.5" class="mono" font-size="12" font-weight="700" fill="#34D399" letter-spacing="0.5">IN PRODUCTION</text>
<text x="28" y="112" class="sans" font-size="16.5" fill="#CBD5E1">Agile project &amp; AI-artifact governance platform</text>
<text x="28" y="137" class="sans" font-size="16.5" fill="#CBD5E1">for a large transportation group. Offline PWA,</text>
<text x="28" y="162" class="sans" font-size="16.5" fill="#CBD5E1">144 components, 30+ tables with row-level security.</text>
<rect x="28" y="196" width="59.0" height="28" rx="8" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
<text x="57.5" y="214.5" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">React</text>
<rect x="95.0" y="196" width="96.0" height="28" rx="8" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
<text x="143.0" y="214.5" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">TypeScript</text>
<rect x="199.0" y="196" width="81.2" height="28" rx="8" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
<text x="239.6" y="214.5" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">Supabase</text>
<rect x="288.2" y="196" width="81.2" height="28" rx="8" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
<text x="328.8" y="214.5" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">Realtime</text>
<rect x="377.4" y="196" width="44.2" height="28" rx="8" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
<text x="399.5" y="214.5" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">PWA</text>
</svg>